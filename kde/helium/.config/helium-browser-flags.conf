# Hardware video acceleration (VA-API, AMD radeonsi) on Wayland
--ozone-platform-hint=auto
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder

# Don't tag surfaces as sRGB. KWin shows tagged sRGB through a gamma 2.2
# curve, which lifts dark grays (40 -> 44), so the tab strip would come out
# lighter than KDE title bars.
--disable-features=WaylandWpColorManagerV1
